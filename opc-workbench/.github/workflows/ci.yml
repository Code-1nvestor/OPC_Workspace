name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  build:
    name: Build frontend & electron
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 验证 Electron 主进程/预加载产物存在
      - name: Verify electron build output
        run: |
          ls -la dist-electron/main.cjs dist-electron/preload.cjs dist-server/index.js dist/index.html

  # 跨平台打包验证：Linux AppImage + deb（配置就绪性验证）
  # Windows 便携包在本地已构建验证；macOS 需 mac 环境（配置已就绪）
  package-linux:
    name: Package Linux (AppImage + deb)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install electron-builder system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2 || true

      - name: Rebuild native modules for Electron
        run: npm run rebuild:electron

      - name: Package Linux
        run: npx electron-builder --linux --publish never
        env:
          # 跳过代码签名
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Linux artifacts
        run: |
          ls -la release/*.AppImage release/*.deb 2>/dev/null || ls -la release/
